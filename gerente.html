<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gerente</title>
  <link rel="stylesheet" href="gerente.css">
  <link rel="stylesheet" href="style_index.css">
</head>
<body>

<section class="main5">
  <header>
    <div class="center menu-container">
      <div class="logo">
        <h3>Gerente</h3>
      </div>
      <div class="menu">
        <a class="active-menu" href="index.html">Inicio</a>
        <a href="#" onclick="mostrarSeccion('registrar')">Registrar usuarios</a>
        <a href="#" onclick="mostrarSeccion('informe')">Usuarios registrados</a>
        <a href="#" onclick="logout()">Cerrar sesión</a>
      </div>
    </div>
  </header>

  <main>
    <center><h1>Panel Gerente</h1></center>

    <!-- SECCIÓN REGISTRAR USUARIOS -->
    <div  id="registrar" class="seccion" style="display: none;">
      <h2>Registrar Nuevo Usuario</h2>
      <form id="formNuevoUsuario">
        <input type="text" id="nuevoUsername" placeholder="Nombre de Usuario (sin espacios)" required pattern="^\S+$" title="No se permiten espacios">
        <input type="password" id="nuevoPassword" placeholder="Contraseña (mínimo 8 caracteres)" required minlength="8">
        <input type="text" id="nuevoNombre" placeholder="Nombre" required>
        <input type="text" id="nuevoApellido" placeholder="Apellido" required>
        <input type="date" id="nuevoNacimiento" placeholder="Fecha de Nacimiento" required>
        <select id="nuevoRol" required>
          <option value="">Seleccionar Rol</option>
          <option value="Usuario">Usuario</option>
          <option value="Entrenador">Entrenador</option>
          <option value="Administrador">Administrador</option>
        </select>
        <button type="submit">Registrar</button>
      </form>
      <p id="mensajeRegistro"></p>
    </div>

    <!-- SECCIÓN INFORME DE USUARIOS -->
    <div id="informe" class="seccion" style="display: none;">
      <h2>Usuarios Registrados</h2>
        <table>
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Contraseña</th> <!-- NUEVA COLUMNA -->
              <th>Nombre</th>
              <th>Apellido</th>
              <th>Edad</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
    </div>
  </main>
</section>

<script>
  const actual = JSON.parse(localStorage.getItem("usuarioActual"));
  if (!actual || actual.rol !== "Gerente") {
    window.location.href = "index.html";
  }

  function mostrarSeccion(id) {
    const secciones = document.querySelectorAll('.seccion');
    secciones.forEach(sec => sec.style.display = 'none');
    const seccionMostrada = document.getElementById(id);
    if (seccionMostrada) {
      seccionMostrada.style.display = 'block';
    }
  }

  function calcularEdad(fechaNacimiento) {
    const hoy = new Date();
    const nacimiento = new Date(fechaNacimiento);
    let edad = hoy.getFullYear() - nacimiento.getFullYear();
    const mes = hoy.getMonth() - nacimiento.getMonth();
    if (mes < 0 || (mes === 0 && hoy.getDate() < nacimiento.getDate())) {
      edad--;
    }
    return edad;
  }

  document.getElementById("formNuevoUsuario").addEventListener("submit", function (e) {
    e.preventDefault();

    const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

    const username = document.getElementById("nuevoUsername").value.trim();
    const password = document.getElementById("nuevoPassword").value.trim();
    const nombre = document.getElementById("nuevoNombre").value.trim();
    const apellido = document.getElementById("nuevoApellido").value.trim();
    const nacimiento = document.getElementById("nuevoNacimiento").value;
    const rol = document.getElementById("nuevoRol").value;

    const mensaje = document.getElementById("mensajeRegistro");

    if (username.includes(" ")) {
      mensaje.textContent = "❌ El nombre de usuario no debe contener espacios.";
      mensaje.className = "error";
      return;
    }

    if (password.length < 8) {
      mensaje.textContent = "❌ La contraseña debe tener al menos 8 caracteres.";
      mensaje.className = "error";
      return;
    }

    const edad = calcularEdad(nacimiento);

    if (!rol || !["Usuario", "Entrenador", "Administrador"].includes(rol)) {
      mensaje.textContent = "❌ Rol no válido.";
      mensaje.className = "error";
      return;
    }

    if (usuarios.some(u => u.username === username)) {
      mensaje.textContent = "❌ El nombre de usuario ya existe.";
      mensaje.className = "error";
      return;
    }

    const nuevoUsuario = {
      username,
      password,
      nombre,
      apellido,
      edad,
      nacimiento,
      rol,
      asistencias: []
    };

    usuarios.push(nuevoUsuario);
    localStorage.setItem("usuarios", JSON.stringify(usuarios));

    mensaje.textContent = "✅ Usuario registrado correctamente.";
    mensaje.className = "success";
    this.reset();
    cargarUsuarios();
  });

 function cargarUsuarios() {
  const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
  const tabla = document.getElementById("tablaUsuarios");
  tabla.innerHTML = "";

  usuarios.forEach(u => {
    const puedeEliminar = u.username !== actual.username && u.rol !== "Gerente";
    const fila = `
      <tr>
        <td>${u.username}</td>
        <td>${u.password}</td> <!-- NUEVA COLUMNA -->
        <td>${u.nombre}</td>
        <td>${u.apellido}</td>
        <td>${u.edad}</td>
        <td>${u.rol}</td>
        <td>${puedeEliminar ? `<button onclick="eliminarUsuario('${u.username}')">Eliminar</button>` : "-"}</td>
      </tr>`;
    tabla.innerHTML += fila;
  });
}

  function eliminarUsuario(username) {
    if (confirm("¿Deseas eliminar este usuario?")) {
      let usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];
      usuarios = usuarios.filter(u => u.username !== username);
      localStorage.setItem("usuarios", JSON.stringify(usuarios));
      cargarUsuarios();
    }
  }

  function logout() {
    localStorage.removeItem("usuarioActual");
    window.location.href = "index.html";
  }

  cargarUsuarios();
</script>

</body>
</html>
